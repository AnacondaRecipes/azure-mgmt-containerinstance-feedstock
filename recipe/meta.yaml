{% set name = "azure-mgmt-containerinstance" %}
{% set version = "10.2.0b1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.zip
  sha256: bf4bb77bd6681270dd0a733aa3a7c3ecdfacba8e616d3a8c3b98cce9c48cc7c0

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<38]

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
  run:
    - python
    - isodate >=0.6.1
    - typing-extensions >=4.6.0
    - azure-common >=1.1
    - azure-mgmt-core >=1.3.2

test:
  imports:
    - azure.mgmt.containerinstance
    - azure.mgmt.containerinstance.models
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Azure/azure-sdk-for-python
  summary: Microsoft Azure Container Instance Client Library for Python
  description: |
    This is the Microsoft Azure Container Instance Client Library.

    Azure Resource Manager (ARM) is the next generation of management APIs that
    replace the old Azure Service Management (ASM).
  license: MIT
  license_file: LICENSE
  license_family: MIT
  dev_url: https://github.com/Azure/azure-sdk-for-python
  doc_url: https://docs.microsoft.com/en-us/azure/developer/python

extra:
  recipe-maintainers:
    - xylar
